<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#0c0e11;color:#e6e9ed;font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{color:#5e9cff;text-decoration:none}
a:hover{color:#8da3ff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#262c34;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
</style>
</helmet>
<div style="display:flex;flex-direction:column;height:{{ height }};width:100%;min-width:720px;overflow:hidden;background:#0c0e11;color:#e6e9ed;font-family:'Hanken Grotesk',system-ui,sans-serif">

  <div style="display:flex;height:46px;flex-shrink:0;align-items:center;gap:16px;border-bottom:1px solid #1c2128;background:#0e1116;padding-left:16px">
    <div style="display:flex;align-items:center;gap:9px">
      <div style="display:flex;width:19px;height:19px;align-items:center;justify-content:center;border-radius:6px;background:linear-gradient(to bottom right,#8da3ff,#5f74e0)">
        <div style="width:7px;height:7px;border-radius:999px;background:#0e1116"></div>
      </div>
      <span style="font-size:14.5px;font-weight:700;letter-spacing:-0.01em;color:#e6e9ed">Arc</span>
      <span style="font-size:13px;color:#646a72">/</span>
      <button style="display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:6px;padding:4px 7px;font-size:13px;font-weight:500;color:#cfd5db" style-hover="background:#171c22;color:#e6e9ed">{{ project }}<span style="font-size:9px;color:#7f858b">▾</span></button>
      <span style="font-size:13px;color:#646a72">/</span>
      <button style="display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:6px;padding:4px 7px;font-size:13px;font-weight:500;color:#cfd5db" style-hover="background:#171c22;color:#e6e9ed">{{ focus }}<span style="font-size:9px;color:#7f858b">▾</span></button>
    </div>
    <div style="display:flex;min-width:0;flex:1;justify-content:center">
      <button onClick="{{ openPalette }}" style="display:flex;width:min(520px,42%);cursor:text;align-items:center;gap:10px;border-radius:9px;border:1px solid #20262e;background:#13171d;padding:7px 12px;color:#7f858b" style-hover="border-color:#2a313a;background:#171c22">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5.5" cy="5.5" r="4"></circle><path d="M9 9l3 3" stroke-linecap="round"></path></svg>
        <span style="flex:1;text-align:left;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Search agents, sessions, commands…</span>
        <span style="border-radius:5px;border:1px solid #1c2128;padding:2px 6px;font-family:'JetBrains Mono',monospace;font-size:11px">Ctrl+P</span>
      </button>
    </div>
    <div style="display:flex;height:100%;flex-shrink:0;align-items:center;gap:10px">
      <button onClick="{{ newAgent }}" style="display:flex;align-items:center;gap:6px;white-space:nowrap;border:0;border-radius:8px;background:#5e9cff;padding:7px 12px;font-size:12.5px;font-weight:600;color:#0c0e11" style-hover="background:#8da3ff"><span style="margin-top:-1px;font-size:15px;line-height:1">+</span>New agent</button>
      <div style="display:flex;height:100%;align-items:center;border-left:1px solid #1c2128">
        <button aria-label="Minimize" style="display:flex;height:32px;width:44px;align-items:center;justify-content:center;border:0;background:transparent;color:#cfd5db" style-hover="background:rgba(255,255,255,0.1)">–</button>
        <button aria-label="Maximize" style="display:flex;height:32px;width:44px;align-items:center;justify-content:center;border:0;background:transparent;color:#cfd5db" style-hover="background:rgba(255,255,255,0.1)">□</button>
        <button aria-label="Close" style="display:flex;height:32px;width:44px;align-items:center;justify-content:center;border:0;background:transparent;color:#cfd5db" style-hover="background:#e0726c;color:#e6e9ed">✕</button>
      </div>
    </div>
  </div>

  <div style="display:flex;min-height:0;flex:1">
    <nav style="display:flex;flex-shrink:0;flex-direction:column;gap:3px;width:78px;border-right:1px solid #1c2128;background:#0e1116;padding:10px 0">
      <sc-for list="{{ navTop }}" as="it" hint-placeholder-count="8">
        <button onClick="{{ it.go }}" title="{{ it.label }}" aria-label="{{ it.label }}" style="position:relative;margin:0 8px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;border-radius:10px;background:transparent;padding:11px 0;color:{{ it.color }}" style-hover="color:{{ it.hoverColor }}">
          <sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;inset:0;border-radius:10px;background:rgba(94,156,255,0.1)"></span>
            <span style="position:absolute;left:-8px;top:50%;height:20px;width:3px;transform:translateY(-50%);border-radius:0 3px 3px 0;background:#5e9cff"></span>
          </sc-if>
          <span style="position:relative;z-index:1;display:block;width:20px;height:20px">
            <span style="display:block;width:20px;height:20px;background:currentColor;-webkit-mask:{{ it.mask }};mask:{{ it.mask }}"></span>
            <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;right:-8px;top:-6px;display:flex;height:15px;min-width:15px;align-items:center;justify-content:center;border-radius:999px;background:#e6b450;padding:0 4px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:#0c0e11">{{ it.badge }}</span>
            </sc-if>
          </span>
          <span style="position:relative;z-index:1;font-size:10px;font-weight:600">{{ it.label }}</span>
        </button>
      </sc-for>
      <div style="flex:1"></div>
      <sc-for list="{{ navBottom }}" as="it" hint-placeholder-count="1">
        <button onClick="{{ it.go }}" title="{{ it.label }}" aria-label="{{ it.label }}" style="position:relative;margin:0 8px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;border-radius:10px;background:transparent;padding:11px 0;color:{{ it.color }}" style-hover="color:{{ it.hoverColor }}">
          <sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;inset:0;border-radius:10px;background:rgba(94,156,255,0.1)"></span>
            <span style="position:absolute;left:-8px;top:50%;height:20px;width:3px;transform:translateY(-50%);border-radius:0 3px 3px 0;background:#5e9cff"></span>
          </sc-if>
          <span style="position:relative;z-index:1;display:block;width:20px;height:20px;background:currentColor;-webkit-mask:{{ it.mask }};mask:{{ it.mask }}"></span>
          <span style="position:relative;z-index:1;font-size:10px;font-weight:600">{{ it.label }}</span>
        </button>
      </sc-for>
    </nav>

    <main style="position:relative;min-width:0;flex:1;overflow:auto;background:#0c0e11">
      <sc-if value="{{ hasChildren }}" hint-placeholder-val="{{ false }}">{{ children }}</sc-if>
      <sc-if value="{{ noChildren }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;border-bottom:1px solid #1c2128;background:#0c0e11;padding:20px 28px 16px">
          <div style="min-width:0">
            <h1 style="margin:0;font-size:25px;font-weight:700;letter-spacing:-0.02em;color:#e6e9ed">{{ activeLabel }}</h1>
            <div style="margin-top:4px;font-size:13px;color:#cfd5db">Shell placeholder. Pages mount their surface here.</div>
          </div>
        </div>
      </sc-if>
    </main>
  </div>

  <sc-if value="{{ showFooter }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;height:28px;flex-shrink:0;align-items:center;gap:16px;border-top:1px solid #2a313a;background:#13171d;padding:0 16px;overflow:hidden">
      <sc-for list="{{ hints }}" as="h" hint-placeholder-count="4">
        <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#cfd5db;white-space:nowrap">
          <span style="border-radius:5px;border:1px solid #20262e;padding:2px 6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#e6e9ed">{{ h.glyph }}</span>{{ h.label }}
        </span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;surface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cockpit&quot;,&quot;jarvis&quot;,&quot;agent&quot;,&quot;radar&quot;,&quot;sessions&quot;,&quot;files&quot;,&quot;usage&quot;,&quot;code&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;cockpit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;project&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;All projects&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Everything&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showFooter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;badges&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, number&gt;&quot;},&quot;hints&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{glyph:string,label:string}[]&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(surface:string)=&gt;void&quot;},&quot;onOpenPalette&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onNewAgent&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
const ICON_BASE = "https://unpkg.com/lucide-static@0.460.0/icons/";
const TOP = [
  ["cockpit", "Cockpit", "layout-dashboard"],
  ["jarvis", "Jarvis", "brain"],
  ["agent", "Agent", "bot"],
  ["radar", "Radar", "radar"],
  ["sessions", "Sessions", "square-stack"],
  ["files", "Diff", "git-compare"],
  ["usage", "Usage", "gauge"],
  ["code", "Code", "file-code-2"],
];
const DEFAULT_HINTS = [
  { glyph: "Ctrl+P", label: "Command palette" },
  { glyph: "g", label: "Go to surface" },
  { glyph: "n", label: "New agent" },
  { glyph: "?", label: "Shortcuts" },
];
class Component extends DCLogic {
  state = { surface: null };
  renderVals() {
    const p = this.props;
    const active = this.state.surface ?? p.surface ?? "cockpit";
    const badges = p.badges ?? { cockpit: 2, jarvis: 1 };
    const go = (key) => () => { this.setState({ surface: key }); p.onNavigate?.(key); };
    const item = ([key, label, icon]) => {
      const on = key === active;
      return {
        key, label, active: on, badge: badges[key] || 0, go: go(key),
        color: on ? "#aebfff" : "#7f858b",
        hoverColor: on ? "#aebfff" : "#c3cad1",
        mask: `url(${ICON_BASE}${icon}.svg) center / 20px 20px no-repeat`,
      };
    };
    const all = [...TOP, ["settings", "Settings", "settings"]];
    const hasChildren = p.children != null && p.children !== false;
    return {
      height: p.height ?? "100vh",
      project: p.project ?? "All projects",
      focus: p.focus ?? "Everything",
      navTop: TOP.map(item),
      navBottom: [item(all[8])],
      activeLabel: (all.find((a) => a[0] === active) || all[0])[1],
      children: p.children,
      hasChildren, noChildren: !hasChildren,
      showFooter: p.showFooter ?? true,
      hints: p.hints ?? DEFAULT_HINTS,
      openPalette: () => p.onOpenPalette?.(),
      newAgent: () => p.onNewAgent?.(),
    };
  }
}
</script>
</body>
</html>
