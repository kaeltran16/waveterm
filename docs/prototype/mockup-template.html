<!DOCTYPE html>
<!--
  Mockup kit — copy this file to start any UI mockup/prototype in this repo.
  Prototype first, always: UI changes get a validated high-fidelity mockup before code.

  AUDIT CHECKLIST — run this before presenting the mockup:
  1. every color from the generated :root tokens below (no hand-added hex; regenerate
     after @theme changes with `task mockup:kit`)
  2. contrast floor: text >= 4.5:1, non-text >= 3:1; ink ramp steps ink-faint < muted < ink-mid < secondary
  3. status never color alone — pair amber/green/red with an icon, label, or dot
  4. focus-visible ring on every interactive element (keyboard first)
  5. reduced motion respected (prefers-reduced-motion)
  6. card recipe: briefing-surface cards = bg-surface + border-border + 10px;
     generic panels = bg-surface-raised + edge-mid + 6px (see .card vs .panel)
  7. accent only for the single most important action per screen
  8. motion only from the micro scale: 140ms cubic-bezier(0.22,1,0.36,1)
  9. no new design vocabulary per surface — reuse these recipes and the tokens

  Workflow: copy -> build with the recipes -> self-audit -> serve (python -m http.server
  8766 in docs/prototype/) -> present. See pi/skills/ui-mockup for the full workflow.
-->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* MOCKUP-TOKENS:START */

    --color-border: #1c2128;

    --color-accent-300: #8da3ff;
    --color-accent-400: #5e9cff;
    --color-accent-500: #5f74e0;
    --color-accent-600: #4f61c4;
    --color-accent-700: #3f4ea0;
    --color-accent-800: #2f3b7a;
    --color-accent-900: #232c5c;
    --color-accent: #5e9cff;
    --color-accenthover: #8da3ff;
    --color-accent-soft: #aebfff;
    --color-accentbg: rgba(94, 156, 255, 0.12);
    --color-skill: #c58cff;
    --color-skill-soft: #dcc0ff;
    --color-error: #e0726c;
    --color-warning: #e6b450;
    --color-asking: #e6b450;
    --color-success: #54c79a;
    --color-cacheread: #5b6675;
    --color-on-warning: #1a1306;
    --color-provider-claude: #d97757;
    --color-provider-codex: #96aacd;
    --color-provider-opencode: #a78bfa;

    --color-success-soft: #bfe6d6;

    --color-feed-label: #777f89;
    --color-feed-summary: #9aa3ad;

    --color-rt-codex-line: rgba(236, 236, 236, 0.32);
    --color-rt-opencode: #a78bfa;
    --color-rt-opencode-soft: rgba(167, 139, 250, 0.13);
    --color-rt-opencode-line: rgba(167, 139, 250, 0.34);

    --color-rt-pi-soft: rgba(236, 236, 236, 0.13);

    --color-hover: rgba(255, 255, 255, 0.1);
    --color-hoverbg: rgba(255, 255, 255, 0.2);
    --color-highlightbg: rgba(255, 255, 255, 0.2);
    --color-syntax-keyword: #aebfff;

/* MOCKUP-TOKENS:END */

  :root {
    --dur-micro: 140ms;
    --curve-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--color-background); }
  body {
    font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
    background: var(--color-background);
    color: var(--color-primary);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding: 16px 24px 48px;
  }
  .stage { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  /* ── recipes (reuse, don't invent) ───────────────────────────────────── */

  /* section header: label + count pill + hairline + optional action */
  .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sec-head .label {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--color-feed-label);
  }
  .sec-head .count {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; color: var(--color-muted);
    background: var(--color-surface-raised); border: 1px solid var(--color-edge-faint); border-radius: 999px; padding: 1px 8px;
  }
  .sec-head .rule { flex: 1; height: 1px; background: var(--color-edge-faint); }
  .sec-head .action {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; color: var(--color-accent-soft);
    background: var(--color-accentbg); border: 1px solid rgba(94, 156, 255, 0.4); border-radius: 7px; padding: 4px 10px; cursor: pointer;
    transition: all var(--dur-micro) var(--curve-out);
  }
  .sec-head .action:hover { border-color: rgba(94, 156, 255, 0.6); background: rgba(94, 156, 255, 0.18); }

  /* cards: .card = briefing-surface convention, .panel = generic DESIGN.md recipe */
  .card { border: 1px solid var(--color-border); background: var(--color-surface); border-radius: 10px; }
  .panel { border: 1px solid var(--color-edge-mid); background: var(--color-surface-raised); border-radius: 6px; }

  /* row: clickable list row with hover + focus ring */
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border-radius: 8px; padding: 7px 10px; cursor: pointer;
    border: 1px solid transparent; background: transparent;
    transition: background var(--dur-micro) var(--curve-out);
  }
  .row:hover { background: var(--color-surface-hover); }
  .row:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .row .main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .row .name { font-size: 12.5px; font-weight: 500; color: var(--color-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .age { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--color-ink-faint); flex: none; }

  /* kind badges + status chips: always labeled, never color alone */
  .badge, .chip {
    flex: none; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600;
    text-transform: uppercase; border-radius: 4px; padding: 2px 6px;
  }
  .badge { font-size: 8.5px; letter-spacing: 0.06em; }
  .badge-run { color: var(--color-ink-mid); background: var(--color-surface-raised); border: 1px solid var(--color-edge-faint); }
  .badge-agent { color: var(--color-accent-soft); background: var(--color-accentbg); border: 1px solid rgba(94, 156, 255, 0.25); }
  .badge-blocked { color: var(--color-asking); background: rgba(230, 180, 80, 0.15); border: 1px solid rgba(230, 180, 80, 0.3); }
  .chip-blocked { color: var(--color-asking); background: var(--color-askingbg); }
  .chip-done, .chip-new { color: var(--color-success); background: var(--color-successbg); }
  .chip-running { color: var(--color-secondary); background: var(--color-surface-raised); }
  .chip-asking { color: var(--color-asking); background: var(--color-askingbg); }

  /* status dot: pulse pair for live states (motion-reduce aware) */
  .status-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--color-asking); flex: none; animation: pulseDot 1.6s infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .status-dot { animation: none; }
    .row, .sec-head .action, .more { transition: none; }
  }

  /* buttons (DESIGN.md): primary = accent, secondary = raised + edge-mid, ghost = text */
  .btn-primary {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600;
    color: var(--color-background); background: var(--color-accent); border: none; border-radius: 7px;
    padding: 6px 12px; cursor: pointer; transition: background var(--dur-micro) var(--curve-out);
  }
  .btn-primary:hover { background: var(--color-accenthover); }
  .btn-primary:focus-visible, .btn-secondary:focus-visible, .btn-ghost:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .btn-secondary {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; color: var(--color-muted);
    background: var(--color-surface-raised); border: 1px solid var(--color-edge-mid); border-radius: 7px;
    padding: 6px 12px; cursor: pointer; transition: all var(--dur-micro) var(--curve-out);
  }
  .btn-secondary:hover { color: var(--color-primary); border-color: var(--color-edge-strong); background: var(--color-surface-hover); }
  .btn-ghost {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; color: var(--color-muted);
    background: none; border: none; border-radius: 7px; padding: 4px 10px; cursor: pointer;
    transition: background var(--dur-micro) var(--curve-out);
  }
  .btn-ghost:hover { background: var(--color-surface-hover); color: var(--color-primary); }

  /* more-link, group label, tags, progress track, skeleton */
  .more {
    width: fit-content; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600;
    color: var(--color-accent-soft); background: none; border: none; border-radius: 7px; padding: 4px 10px;
    cursor: pointer; transition: background var(--dur-micro) var(--curve-out);
  }
  .more:hover { background: var(--color-surface-hover); }
  .group-label {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--color-feed-label); padding: 2px 10px;
  }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--color-muted); background: var(--color-surface); border: 1px solid var(--color-edge-faint); border-radius: 999px; padding: 1px 8px; }
  .track { flex: 1; height: 4px; border-radius: 999px; background: var(--color-surface); overflow: hidden; }
  .track .fill { height: 100%; border-radius: 999px; background: var(--color-accent); }
  .track .fill.amber { background: var(--color-asking); }
  .skeleton { border-radius: 10px; background: var(--color-surface); animation: pulseDot 1.6s infinite; }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<div class="stage">

  <!-- copy the recipes above into your design; delete this demo section -->

  <div class="sec-head">
    <span class="label">Section label</span>
    <span class="count">12</span>
    <span class="rule"></span>
    <button class="action">+ Action</button>
  </div>

  <button class="row">
    <span class="badge badge-run">run</span>
    <span class="main"><span class="name">Row title</span><span class="meta">meta · mono · muted</span></span>
    <span class="chip chip-blocked">blocked</span>
    <span class="age">2m</span>
  </button>

  <div class="card" style="padding: 12px 16px">
    <span style="display:flex;align-items:center;gap:10px">
      <span class="status-dot"></span>
      <span style="font-size:13.5px;font-weight:700">Needs you</span>
      <span style="margin-left:auto" class="chip chip-asking">3</span>
    </span>
  </div>

  <div class="panel" style="padding: 12px 16px">
    <span style="font-size:13px;font-weight:600">Generic panel</span>
    <span style="display:block;margin-top:8px;font-size:12px;color:var(--color-secondary)">bg-surface-raised + edge-mid + 6px — the DESIGN.md recipe.</span>
  </div>

  <span class="group-label">Today</span>
  <button class="more">+2 more →</button>

  <div style="display:flex;gap:8px">
    <button class="btn-primary">Primary</button>
    <button class="btn-secondary">Secondary</button>
    <button class="btn-ghost">Ghost</button>
  </div>

</div>
</body>
</html>
